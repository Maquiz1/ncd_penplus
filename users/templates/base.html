<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NCD PEN-Plus{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f8; color: #1f2933; }
    header { background: #1d4e89; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    header a, header button { color: #fff; background: none; border: none; font: inherit; cursor: pointer; text-decoration: underline; }
    main { max-width: 1000px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 24px; }
    .stat { font-size: 2rem; font-weight: 600; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; margin-top: 4px; }
    .btn { margin-top: 16px; padding: 10px 16px; background: #1d4e89; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <strong>NCD PEN-Plus</strong>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        {{ user.get_username }} · <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
