# Host nginx site for https://penplus.tamris.org
#
#   cp docker/nginx-penplus.conf /etc/nginx/sites-available/penplus.tamris.org
#   ln -s /etc/nginx/sites-available/penplus.tamris.org /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d penplus.tamris.org      # adds the HTTPS server block and the HTTP -> HTTPS redirect
#
# The DNS A record for penplus.tamris.org must point to 31.97.187.66 before running certbot.

server {
    listen 80;
    server_name penplus.tamris.org;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
    }
}
