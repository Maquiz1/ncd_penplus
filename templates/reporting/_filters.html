<form class="card card-body shadow-sm mb-3 d-print-none py-2" method="get">{% for k, v in hidden_filters.items %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
  <div class="row g-2 align-items-end">
    {% if filters.zones|length > 1 %}<div class="col-6 col-md-2"><label class="form-label small mb-0">Zone</label><select class="form-select form-select-sm" name="zone"><option value="">All</option>{% for z in filters.zones %}<option value="{{ z.pk }}" {% if filters.zone == z %}selected{% endif %}>{{ z }}</option>{% endfor %}</select></div>{% endif %}
    {% if filters.regions|length > 1 %}<div class="col-6 col-md-2"><label class="form-label small mb-0">Region</label><select class="form-select form-select-sm" name="region"><option value="">All</option>{% for r in filters.regions %}<option value="{{ r.pk }}" {% if filters.region == r %}selected{% endif %}>{{ r.name }}</option>{% endfor %}</select></div>{% endif %}
    {% if filters.districts|length > 1 %}<div class="col-6 col-md-2"><label class="form-label small mb-0">District</label><select class="form-select form-select-sm" name="district"><option value="">All</option>{% for d in filters.districts %}<option value="{{ d.pk }}" {% if filters.district == d %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>{% endif %}
    <div class="col-6 col-md-2"><label class="form-label small mb-0">Site</label><select class="form-select form-select-sm" name="site"><option value="">All sites</option>{% for f in filters.sites %}<option value="{{ f.pk }}" {% if filters.site == f %}selected{% endif %}>{{ f.name }}</option>{% endfor %}</select></div>
    <div class="col-6 col-md-2"><label class="form-label small mb-0">Period</label><select class="form-select form-select-sm js-period" name="period">{% for v, l in filters.periods %}<option value="{{ v }}" {% if filters.period == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
    <div class="col-6 col-md-2 js-custom-dates {% if filters.period != 'custom' %}d-none{% endif %}"><label class="form-label small mb-0">From</label><input class="form-control form-control-sm" type="date" name="start" value="{{ filters.start|date:'Y-m-d' }}"></div>
    <div class="col-6 col-md-2 js-custom-dates {% if filters.period != 'custom' %}d-none{% endif %}"><label class="form-label small mb-0">To</label><input class="form-control form-control-sm" type="date" name="end" value="{{ filters.end|date:'Y-m-d' }}"></div>
    {% if filters.with_disease %}<div class="col-6 col-md-2"><label class="form-label small mb-0">Disease</label><select class="form-select form-select-sm" name="disease"><option value="">All active diseases</option>{% for d in filters.diseases %}<option value="{{ d.code }}" {% if filters.disease == d %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>{% endif %}
    <div class="col-6 col-md-auto d-flex gap-2"><button class="btn btn-sm btn-primary">Apply</button>
      <a class="btn btn-sm btn-outline-secondary" href="?{{ filters.querystring }}&format=pdf" title="Download PDF"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
      {% if csv_available %}<a class="btn btn-sm btn-outline-secondary" href="?{{ filters.querystring }}&format=csv" title="Download CSV"><i class="bi bi-filetype-csv"></i> CSV</a>{% endif %}</div>
  </div>
</form>
