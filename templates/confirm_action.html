{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm" style="max-width: 720px;">
  <div class="card-header bg-body"><h1 class="h5 mb-0">{{ title }}</h1></div>
  <div class="card-body">
    {% if message %}<p>{{ message }}</p>{% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'' }}">
      {% if form %}{% include "_form_fields.html" %}{% endif %}
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn {{ button_class|default:'btn-primary' }}" {% if disabled %}disabled{% endif %}>{{ button|default:"Confirm" }}</button>
        <a href="{{ cancel_url|default:'/' }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
