{% if is_paginated %}
<nav aria-label="Pages" class="mt-3">
  <ul class="pagination pagination-sm mb-0">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="{% querystring page=page_obj.previous_page_number %}">&laquo; Previous</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ paginator.num_pages }} · {{ paginator.count }} records</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="{% querystring page=page_obj.next_page_number %}">Next &raquo;</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
