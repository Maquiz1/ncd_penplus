{# Steps of a visit, each linked directly to where it is done. #}
<div class="pathway-steps">
  {% for s in steps %}{% if s.perm in perms %}<a class="pathway-step{% if s.done %} is-done{% endif %}" href="{{ s.url }}"><i class="bi {% if s.done %}bi-check-circle-fill{% else %}bi-circle{% endif %}"></i> {{ s.label }}{% if s.note %} <small>{{ s.note }}</small>{% endif %}</a>{% endif %}{% endfor %}
</div>
