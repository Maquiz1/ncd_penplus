{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm" style="max-width: 560px;">
  <div class="card-header bg-body"><h1 class="h5 mb-0">Change password</h1></div>
  <div class="card-body">
    <form method="post" novalidate>{% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input class="form-control {% if field.errors %}is-invalid{% endif %}" type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" autocomplete="{% if field.name == 'old_password' %}current-password{% else %}new-password{% endif %}">
        {% for e in field.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
        {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
      </div>
      {% endfor %}
      <button class="btn btn-primary" type="submit">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
