{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block auth_content %}
<div class="card shadow-sm"><div class="card-body p-4">
  <h2 class="h5">Reset your password</h2>
  <p class="small text-body-secondary">Enter your account email. If it is registered, you will receive a link to set a new password.</p>
  <form method="post" novalidate>{% csrf_token %}
    <input class="form-control mb-3" type="email" name="email" placeholder="Email address" required autofocus>
    <button class="btn btn-primary w-100" type="submit">Send reset link</button>
  </form>
  <div class="text-center mt-3"><a class="small" href="{% url 'login' %}">Back to sign in</a></div>
</div></div>
{% endblock %}
