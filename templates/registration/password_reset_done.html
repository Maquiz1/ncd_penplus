{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block auth_content %}
<div class="card shadow-sm"><div class="card-body p-4">
  <h2 class="h5">Check your email</h2>
  <p>If an account exists for that address, a password reset link has been sent. The link expires and can be used once.</p>
  <a href="{% url 'login' %}" class="btn btn-outline-primary w-100">Back to sign in</a>
</div></div>
{% endblock %}
